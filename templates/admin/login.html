{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration - Immovia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card p-4">
                    <div class="text-center mb-4">
                        <i class="fas fa-lock feature-icon"></i>
                        <h2>Administration Immovia</h2>
                        <p class="text-muted">Connectez-vous pour accéder à l'administration</p>
                    </div>

                    {% if form.errors %}
                    <div class="alert alert-danger">
                        <strong>Erreur :</strong> Nom d'utilisateur ou mot de passe incorrect.
                    </div>
                    {% endif %}

                    {% if next %}
                    <div class="alert alert-info">
                        Veuillez vous connecter pour continuer.
                    </div>
                    {% endif %}

                    <form method="post" action="{{ app_path }}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}" />

                        <div class="mb-3">
                            <label for="id_username" class="form-label">
                                <i class="fas fa-user"></i> Nom d'utilisateur
                            </label>
                            <input type="text" name="username" id="id_username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">
                                <i class="fas fa-lock"></i> Mot de passe
                            </label>
                            <input type="password" name="password" id="id_password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-sign-in-alt"></i> Se connecter
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
