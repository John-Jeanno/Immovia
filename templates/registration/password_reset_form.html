{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="mb-2">Réinitialiser le mot de passe</h2>
                        <p class="text-muted">Entrez votre email pour réinitialiser votre mot de passe</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Adresse email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="fas fa-envelope text-primary"></i>
                                </span>
                                {{ form.email }}
                            </div>
                        </div>

                        {% if form.email.errors %}
                            <div class="alert alert-danger">
                                {{ form.email.errors }}
                            </div>
                        {% endif %}

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
                            <i class="fas fa-envelope"></i> Envoyer un email de réinitialisation
                        </button>
                    </form>

                    <a href="{% url 'login' %}" class="btn btn-secondary w-100 py-2 fw-bold">
                        <i class="fas fa-arrow-left"></i> Retour à la connexion
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .input-group input {
        border-left: none;
        border-right: none;
        border-top: none;
        border-bottom: 2px solid #dee2e6;
        padding: 10px 0;
        transition: border-color 0.3s;
    }

    .input-group input:focus {
        box-shadow: none;
        border-bottom-color: #0d6efd;
    }

    .input-group-text {
        border-left: none;
        border-right: none;
        border-top: none;
        border-bottom: 2px solid #dee2e6;
        padding: 10px 5px;
    }
</style>
{% endblock %}
