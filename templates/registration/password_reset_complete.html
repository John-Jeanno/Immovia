{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="mb-2">Mot de passe réinitialisé</h2>
                        <p class="text-muted">Votre mot de passe a été réinitialisé avec succès</p>
                    </div>

                    <div class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle"></i> Votre mot de passe a été modifié avec succès.
                    </div>

                    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
